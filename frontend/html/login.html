<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - Todo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1 class="auth-title">欢迎回来</h1>
      <p class="auth-subtitle">登录以继续使用 Todo</p>
      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" name="username" required minlength="3" maxlength="50" autocomplete="username" placeholder="输入用户名">
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="current-password" placeholder="输入密码">
        </div>
        <button type="submit" class="btn btn-primary btn-full">登录</button>
        <div id="errorMsg" class="auth-error"></div>
      </form>
      <p class="auth-switch">
        还没有账号？<a href="register.html">去注册</a>
      </p>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
