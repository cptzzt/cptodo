<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - Todo</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>登录</h1>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" name="username" required minlength="3" maxlength="50" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="current-password">
        </div>
        <div class="form-group">
          <button type="submit" class="btn btn-primary">登录</button>
        </div>
        <div id="errorMsg" class="error-msg"></div>
      </form>
      <p class="switch-link">
        还没有账号？<a href="register.html">去注册</a>
      </p>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
