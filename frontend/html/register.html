<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - Todo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1 class="auth-title">创建账号</h1>
      <p class="auth-subtitle">注册后开始管理你的任务</p>
      <form class="auth-form" id="registerForm">
        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" name="username" required minlength="3" maxlength="50" autocomplete="username" placeholder="3-50 个字符">
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" placeholder="至少 6 位">
        </div>
        <div class="form-group">
          <label for="confirmPassword">确认密码</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" autocomplete="new-password" placeholder="再次输入密码">
        </div>
        <button type="submit" class="btn btn-primary btn-full">注册</button>
        <div id="errorMsg" class="auth-error"></div>
      </form>
      <p class="auth-switch">
        已有账号？<a href="login.html">去登录</a>
      </p>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/register.js"></script>
</body>
</html>
