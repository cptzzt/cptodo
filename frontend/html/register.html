<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - Todo</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>注册</h1>
      <form id="registerForm">
        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" name="username" required minlength="3" maxlength="50" autocomplete="username">
          <small class="hint">3-50 个字符</small>
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
          <small class="hint">至少 6 位</small>
        </div>
        <div class="form-group">
          <label for="confirmPassword">确认密码</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
          <button type="submit" class="btn btn-primary">注册</button>
        </div>
        <div id="errorMsg" class="error-msg"></div>
      </form>
      <p class="switch-link">
        已有账号？<a href="login.html">去登录</a>
      </p>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/register.js"></script>
</body>
</html>
