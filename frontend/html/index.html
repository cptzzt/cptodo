<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 Todo</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>我的 Todo</h1>
      <button id="logoutBtn" class="btn btn-secondary">退出登录</button>
    </header>

    <div class="card">
      <form id="addTaskForm" class="add-task-form">
        <input type="text" id="taskInput" name="content" placeholder="输入新任务..." required maxlength="500" autocomplete="off">
        <button type="submit" class="btn btn-primary">添加</button>
      </form>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" data-tab="all">全部</button>
        <button class="tab-btn" data-tab="pending">未完成</button>
        <button class="tab-btn" data-tab="completed">已完成</button>
      </div>

      <ul id="taskList" class="task-list"></ul>
      <div id="emptyMsg" class="empty-msg" style="display: none;">暂无任务</div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
