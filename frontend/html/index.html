<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPTodo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-layout">
    <!-- 左侧：导航面板 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>CPTodo</h2>
        <button id="logoutBtn" class="btn btn-ghost btn-sm">退出</button>
      </div>

      <nav class="nav-section">
        <div class="nav-group">
          <div class="nav-item active" data-view="notes">
            <span class="nav-icon">📝</span>
            <span class="nav-label">随笔</span>
          </div>
          <div class="nav-item" data-view="today">
            <span class="nav-icon">📅</span>
            <span class="nav-label">今天</span>
            <span class="nav-badge" id="todayBadge" style="display:none;"></span>
          </div>
          <div class="nav-item" data-view="week">
            <span class="nav-icon">📆</span>
            <span class="nav-label">本周</span>
            <span class="nav-badge" id="weekBadge" style="display:none;"></span>
          </div>
        </div>

        <div class="nav-group">
          <div class="nav-group-header">
            <span>项目</span>
            <button id="addProjectBtn" class="btn btn-ghost btn-xs" title="新建项目">+</button>
          </div>
          <div id="projectList" class="nav-list"></div>
        </div>

        <div class="nav-group">
          <div class="nav-group-header">
            <span>标签</span>
            <button id="addTagBtn" class="btn btn-ghost btn-xs" title="新建标签">+</button>
          </div>
          <div id="tagList" class="nav-list"></div>
        </div>
      </nav>
    </aside>

    <!-- 拖拽调整宽度 -->
    <div class="sidebar-resize-handle" id="sidebarResizeHandle"></div>

    <!-- 中间：内容区 -->
    <main class="main-content">
      <header class="content-header">
        <div class="content-title-row">
          <h1 id="viewTitle">随笔</h1>
          <div class="content-actions">
            <button id="showCompletedBtn" class="btn btn-secondary btn-sm">显示已完成</button>
            <button id="clearProjectBtn" class="btn btn-danger btn-sm" style="display:none;">清空项目</button>
            <button id="addTaskBtn" class="btn btn-primary btn-sm">+ 新建</button>
          </div>
        </div>
        <div id="viewSubtitle" class="content-subtitle"></div>
      </header>

      <!-- 随笔快速输入 -->
      <div id="quickNoteInput" class="quick-note-bar" style="display:none;">
        <input type="text" id="quickNoteField" placeholder="快速记录一条随笔，回车保存..." maxlength="255">
      </div>

      <div id="cardList" class="card-list"></div>
      <div id="emptyHint" class="empty-state" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        <p id="emptyText">这里空空如也</p>
      </div>
    </main>

    <!-- 详情面板拖拽 -->
    <div class="detail-resize-handle" id="detailResizeHandle"></div>

    <!-- 右侧：详情面板 -->
    <aside id="detailPanel" class="detail-panel" style="display:none;">
      <div class="detail-header">
        <span class="detail-title" id="detailTitle">详情</span>
        <button id="closeDetailBtn" class="btn btn-ghost btn-sm">关闭</button>
      </div>
      <div class="detail-body">
        <div id="detailType" class="detail-badge"></div>

        <div class="detail-field" id="convertToTaskField" style="display:none;">
          <label class="checkbox-row">
            <input type="checkbox" id="convertToTaskCheck">
            <span>转为任务（不可逆）</span>
          </label>
        </div>

        <div class="detail-field">
          <label class="detail-label">标题</label>
          <input type="text" id="detailTitleInput" class="detail-input" maxlength="255">
        </div>

        <div class="detail-field" id="contentField" style="display:none;">
          <label class="detail-label">内容</label>
          <textarea id="detailContentInput" class="detail-textarea" rows="4" maxlength="500" placeholder="任务内容..."></textarea>
        </div>

        <div class="detail-field">
          <label class="detail-label">备注</label>
          <textarea id="detailNotesInput" class="detail-textarea" rows="3" maxlength="1000" placeholder="添加备注..."></textarea>
        </div>

        <div class="detail-field" id="dueDateField" style="display:none;">
          <label class="detail-label">截止日期</label>
          <input type="date" id="detailDueDateInput" class="detail-input">
        </div>

        <div class="detail-field" id="priorityField" style="display:none;">
          <label class="detail-label">优先级</label>
          <select id="detailPriorityInput" class="detail-input">
            <option value="normal">普通</option>
            <option value="important">重要</option>
          </select>
        </div>

        <div class="detail-field" id="recurringField" style="display:none;">
          <label class="detail-label">重复</label>
          <select id="detailRecurringInput" class="detail-input">
            <option value="">不重复</option>
            <option value="daily">每天</option>
            <option value="weekly">每周</option>
            <option value="monthly">每月</option>
          </select>
        </div>

        <div class="detail-field" id="projectField" style="display:none;">
          <label class="detail-label">所属项目</label>
          <select id="detailProjectInput" class="detail-input">
            <option value="">无项目</option>
          </select>
        </div>

        <div class="detail-field" id="completedField" style="display:none;">
          <label class="checkbox-row">
            <input type="checkbox" id="detailCompletedInput">
            <span>标记为已完成</span>
          </label>
        </div>

        <div class="detail-field" id="tagsField" style="display:none;">
          <label class="detail-label">标签</label>
          <div id="detailTagList" class="detail-tags"></div>
          <div class="tag-add-row">
            <select id="tagAddSelect" class="detail-input">
              <option value="">添加标签...</option>
            </select>
          </div>
        </div>

        <div class="detail-actions">
          <button id="saveDetailBtn" class="btn btn-primary btn-full">保存修改</button>
          <button id="deleteDetailBtn" class="btn btn-danger btn-full">删除</button>
        </div>
      </div>
    </aside>
  </div>

  <!-- 新建弹窗 -->
  <div id="addModal" class="modal" style="display:none;">
    <div class="modal-box">
      <h3 class="modal-title" id="modalTitle">新建</h3>

      <div class="modal-field" id="modalTypeField">
        <label>类型</label>
        <select id="modalTypeSelect">
          <option value="task">任务</option>
          <option value="note">随笔</option>
        </select>
      </div>

      <div class="modal-field">
        <label>标题</label>
        <input type="text" id="modalTitleInput" maxlength="255" placeholder="输入标题...">
      </div>

      <div class="modal-field modal-task-field" id="modalContentField" style="display:none;">
        <label>内容</label>
        <textarea id="modalContentInput" rows="3" maxlength="500" placeholder="输入任务内容..."></textarea>
      </div>

      <div class="modal-field modal-task-field" id="modalDueDateField" style="display:none;">
        <label>截止日期</label>
        <input type="date" id="modalDueDateInput">
      </div>

      <div class="modal-field modal-task-field" id="modalPriorityField" style="display:none;">
        <label>优先级</label>
        <select id="modalPriorityInput">
          <option value="normal">普通</option>
          <option value="important">重要</option>
        </select>
      </div>

      <div class="modal-field modal-task-field" id="modalRecurringField" style="display:none;">
        <label>重复</label>
        <select id="modalRecurringInput">
          <option value="">不重复</option>
          <option value="daily">每天</option>
          <option value="weekly">每周</option>
          <option value="monthly">每月</option>
        </select>
      </div>

      <div class="modal-field modal-task-field" id="modalProjectField" style="display:none;">
        <label>项目</label>
        <select id="modalProjectInput">
          <option value="">无项目</option>
        </select>
      </div>

      <div class="modal-actions">
        <button id="modalCancelBtn" class="btn btn-secondary">取消</button>
        <button id="modalConfirmBtn" class="btn btn-primary">确认新建</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
